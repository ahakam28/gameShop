<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/image.png" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>gameHub-Login Now</title>
  </head>
  <body class="overflow-hidden">
    <main class="h-screen w-full flex items-center justify-center relative">
      <fieldset
        class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
      >
        <legend class="fieldset-legend">Login</legend>

        <label class="label">Email</label>
        <input
          id="login-email"
          type="email"
          class="input"
          placeholder="Email"
        />

        <label class="label">Password</label>
        <input
          id="login-pass"
          type="password"
          class="input"
          placeholder="Password"
        />

        <button id="login-btn" class="btn btn-neutral mt-4">Login</button>
      </fieldset>
      <!-- Alert component fixed and positioned properly -->
      <div
        id="my-element"
        role="alert"
        class="alert alert-warning fixed bottom-5 right-5 z-50 w-80 transition-all duration-500 translate-x-[150%]"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 shrink-0 stroke-current"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <span id="message">Warning: Invalid email address!</span>
      </div>

      <!-- Open the modal using ID.showModal() method -->
      <dialog id="my_modal_2" class="modal">
        <div class="modal-box">
          <h3 class="text-lg font-bold">Greate!</h3>
          <p class="py-4">Login Successfully!!!</p>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button>close</button>
        </form>
      </dialog>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
